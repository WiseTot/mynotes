<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-256.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com https://www.youtube-nocookie.com https://www.youtube.com">
<title>Заметки</title>
<style>
  * { box-sizing: border-box; }
  :root { --ease: cubic-bezier(.22, 1, .36, 1); --accent: #7cc8ff; --violet: #a99bff; color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden; color: #fff;
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(520px 420px at 0% 0%, rgba(110, 90, 255, .22), transparent 70%),
      radial-gradient(620px 520px at 100% 100%, rgba(40, 170, 255, .15), transparent 70%),
      #0c0d14;
  }
  .glass-in {
    background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  .glass-pop {
    background: linear-gradient(135deg, rgba(140, 110, 255, .5), rgba(40, 170, 255, .3)), rgba(16, 18, 30, .92);
    border: 1px solid rgba(255,255,255,.24);
    box-shadow: 0 16px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.35);
    backdrop-filter: blur(18px) saturate(160%);
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  button { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 6px; }

  /* ---------- Заголовок окна ---------- */
  .bar { height: 44px; flex: none; display: flex; align-items: center; padding-left: 16px; -webkit-app-region: drag; user-select: none; position: relative; }
  .bar .ttl { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; opacity: .85; }
  .bar .ttl svg { width: 16px; height: 16px; color: var(--accent); }
  .tabs {
    position: absolute; left: 50%; top: 7px; transform: translateX(-50%); display: flex; padding: 3px; border-radius: 12px;
    -webkit-app-region: no-drag; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  }
  .tabs button {
    position: relative; z-index: 1; height: 26px; padding: 0 16px; border: 0; border-radius: 9px; background: none; cursor: pointer;
    font-size: 13px; opacity: .65; transition: opacity .2s;
  }
  .tabs button:hover { opacity: .9; }
  .tabs button.on { opacity: 1; }
  .tabs .glider {
    position: absolute; top: 3px; height: 26px; border-radius: 9px; transition: left .35s var(--ease), width .35s var(--ease);
    background: linear-gradient(135deg, rgba(140,110,255,.55), rgba(40,170,255,.35)); border: 1px solid rgba(255,255,255,.2);
  }
  /* синхронизация с телефоном */
  .sync { margin-left: auto; display: flex; align-items: center; gap: 6px; padding-right: 8px; -webkit-app-region: no-drag; }
  .sbtn { height: 28px; padding: 0 11px; display: flex; align-items: center; gap: 6px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 600;
    background: linear-gradient(135deg, rgba(140,110,255,.55), rgba(40,170,255,.35)); border: 1px solid rgba(255,255,255,.25);
    animation: glowIn .4s var(--ease), pulseGlow 2.4s ease-in-out infinite; transition: filter .15s; }
  .sbtn.in { background: linear-gradient(135deg, rgba(40,200,170,.5), rgba(40,170,255,.35)); }
  .sbtn:hover { filter: brightness(1.2); }
  .sbtn[disabled] { opacity: .5; animation: none; cursor: default; }
  .sbtn svg { width: 15px; height: 15px; }
  .sbtn b { padding: 0 6px; border-radius: 7px; background: rgba(0,0,0,.25); }
  .sbtn[hidden] { display: none; }
  @keyframes glowIn { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes pulseGlow { 50% { box-shadow: 0 0 14px rgba(124,200,255,.45); } }
  .sstat { font-size: 12px; opacity: .45; white-space: nowrap; cursor: pointer; }
  .sstat.warn { opacity: 1; color: #ffd36b; }
  .scfg { width: 30px; height: 28px; padding: 0; border: 0; border-radius: 9px; background: none; cursor: pointer; opacity: .6; display: grid; place-items: center; }
  .scfg:hover { opacity: 1; background: rgba(255,255,255,.1); }
  .scfg svg { width: 17px; height: 17px; }
  .spop { position: fixed; right: 150px; top: 46px; z-index: 25; width: 340px; padding: 16px; border-radius: 16px; display: none; font-size: 13px; }
  .spop.show { display: block; animation: fade .25s var(--ease); }
  .spop h4 { margin: 0 0 8px; font-size: 15px; }
  .spop h5 { margin: 14px 0 6px; font-size: 13px; }
  .spop p, .spop .hint { margin: 0 0 10px; opacity: .75; line-height: 1.45; }
  .spop .hint { font-size: 12px; opacity: .6; }
  .spop .ok { color: #7dffb5; font-weight: 600; margin-bottom: 6px; }
  .spop hr { border: 0; border-top: 1px solid rgba(255,255,255,.15); margin: 12px 0; }
  .spop input { width: 100%; margin-bottom: 8px; padding: 8px 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); outline: none;
    background: rgba(0,0,0,.25); color: #fff; font: inherit; }
  .spop input:focus { border-color: rgba(140,160,255,.8); }
  .spop .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .spop button { padding: 7px 13px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.1); color: #fff; font: inherit; cursor: pointer; }
  .spop button:hover { background: rgba(255,255,255,.2); }
  .spop button.primary { background: rgba(120,140,255,.6); border-color: rgba(160,175,255,.6); font-weight: 600; }
  .spop button.armed { background: rgba(255,80,80,.45); }
  .spop .msg { min-height: 16px; margin-top: 8px; font-size: 12px; color: #ffd36b; }
  .toast { position: fixed; left: 50%; bottom: 22px; z-index: 30; max-width: 70vw; padding: 10px 16px; border-radius: 13px; font-size: 13px;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s var(--ease); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .wbtns { display: flex; height: 100%; -webkit-app-region: no-drag; }
  .wbtns button { width: 46px; height: 100%; border: 0; background: none; opacity: .7; cursor: pointer; transition: background .15s, opacity .15s; }
  .wbtns button svg { width: 11px; height: 11px; }
  .wbtns button:hover { background: rgba(255,255,255,.08); opacity: 1; }
  .wbtns .wclose:hover { background: #e81123; }

  .views { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: flex; animation: fade .35s var(--ease); }

  /* ---------- Заметки ---------- */
  .app { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 12px 12px; }
  aside { width: 260px; flex: none; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 18px; }
  .new {
    height: 38px; border-radius: 12px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(120,140,255,.45); border: 1px solid rgba(160,175,255,.5); transition: background .2s, transform .1s;
  }
  .new:hover { background: rgba(120,140,255,.6); }
  .new:active { transform: scale(.98); }
  .new svg { width: 16px; height: 16px; }
  input.search, .field {
    width: 100%; font: inherit; color: #fff; padding: 8px 12px; border-radius: 12px; outline: none;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); transition: border-color .2s;
  }
  input.search:focus, .field:focus { border-color: rgba(140,160,255,.7); }
  input::placeholder { color: rgba(255,255,255,.3); }
  .list { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; display: flex; flex-direction: column; gap: 3px; }
  .item { padding: 9px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s; }
  .item:hover { background: rgba(255,255,255,.06); }
  .item.sel { background: rgba(120,140,255,.22); border-color: rgba(160,175,255,.35); }
  .item b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .pv { font-size: 12px; opacity: .5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .dt { font-size: 11px; opacity: .38; }
  .nothing { font-size: 13px; opacity: .45; padding: 8px 4px; }

  /* ---------- телефон (узкий экран): список и заметка по очереди, всё под палец ---------- */
  .back { display: none; }
  /* жесты на карте и графе — наши, а не прокрутка страницы. Для всех вложенных тоже: карточка с обрезкой краёв
     для телефона «прокручиваемая», и без этого Chrome через пару миллиметров забирал палец себе и обрывал перетаскивание */
  .m-stage, .m-stage *, .gview canvas { touch-action: none; }
  .m-stage { -webkit-touch-callout: none; } /* долгое нажатие — без системного меню */
  .m-stage img { -webkit-user-drag: none; }

  /* группы заметок */
  .side-top { display: flex; gap: 8px; }
  .side-top .new { flex: 1; }
  .newg { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); transition: background .2s; }
  .newg:hover { background: rgba(255,255,255,.16); }
  .newg svg { width: 18px; height: 18px; }
  .ghead { display: flex; align-items: center; gap: 7px; margin-top: 6px; padding: 6px 8px; border-radius: 10px; cursor: pointer; user-select: none;
    font-size: 12px; font-weight: 600; letter-spacing: .02em; color: rgba(255,255,255,.8); transition: background .15s; }
  .ghead:hover { background: rgba(255,255,255,.05); }
  .ghead.drop { background: rgba(124,200,255,.18); outline: 1px dashed rgba(124,200,255,.7); }
  .ghead .chev { width: 10px; height: 10px; flex: none; opacity: .6; transition: transform .25s var(--ease); }
  .ghead.shut .chev { transform: rotate(-90deg); }
  .ghead .dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--gc); box-shadow: 0 0 10px var(--gc); cursor: pointer; transition: transform .2s; }
  .ghead .dot:hover { transform: scale(1.35); }
  .ghead.loose .dot { background: rgba(255,255,255,.25); box-shadow: none; cursor: default; }
  .ghead .gname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghead .gname[contenteditable] { background: rgba(0,0,0,.35); border-radius: 5px; padding: 0 4px; outline: none; cursor: text; text-overflow: clip; }
  .ghead .cnt { font-weight: 400; opacity: .45; }
  .ghead .ga { display: none; gap: 1px; }
  .ghead:hover .ga { display: flex; }
  .ghead:hover .cnt { display: none; }
  .ga button { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: none; color: #fff; font-size: 12px; opacity: .7; cursor: pointer; }
  .ga button:hover { opacity: 1; background: rgba(255,255,255,.15); }
  .ga button.armed { opacity: 1; background: rgba(255,80,80,.45); }
  .gitems { display: flex; flex-direction: column; gap: 3px; margin: 2px 0 2px 12px; padding-left: 8px; border-left: 2px solid color-mix(in srgb, var(--gc) 50%, transparent); animation: fade .25s var(--ease); }
  .gitems.drop { background: rgba(124,200,255,.08); border-radius: 0 10px 10px 0; }
  .item.dragging { opacity: .35; }
  .hchip { height: 32px; padding: 0 10px; display: flex; align-items: center; gap: 6px; flex: none; border-radius: 10px; cursor: pointer; font-size: 12px; max-width: 200px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); transition: background .2s; }
  .hchip:hover { background: rgba(255,255,255,.14); }
  .hchip svg { width: 15px; height: 15px; flex: none; }
  .hchip i { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--gc); box-shadow: 0 0 8px var(--gc); }
  .gmenu { position: fixed; z-index: 12; min-width: 210px; max-height: 320px; overflow-y: auto; padding: 6px; border-radius: 13px; display: none; }
  .gmenu.show { display: block; animation: fade .2s var(--ease); }
  .gmenu div { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; cursor: pointer; font-size: 13px; }
  .gmenu div:hover { background: rgba(255,255,255,.18); }
  .gmenu div.on { background: rgba(255,255,255,.26); }
  .gmenu i { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--gc); }

  .editor { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-radius: 18px; }
  .ehead { display: flex; align-items: center; gap: 10px; padding: 18px 22px 2px; }
  #title {
    flex: 1; min-width: 0; padding: 0; border: 0; outline: none; background: none; color: #fff;
    font: 600 24px/1.3 "Segoe UI Variable Display", "Segoe UI", sans-serif;
  }
  #title::placeholder { color: rgba(255,255,255,.22); }
  .del {
    height: 32px; padding: 0 10px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px;
    background: none; border: 1px solid transparent; opacity: .55; transition: opacity .2s, background .2s, border-color .2s;
  }
  .del svg { width: 16px; height: 16px; }
  .del span { display: none; }
  .del:hover { opacity: 1; background: rgba(255,255,255,.07); }
  .del.armed { opacity: 1; background: rgba(255,80,80,.25); border-color: rgba(255,110,110,.5); }
  .del.armed span { display: inline; }
  .meta { padding: 0 22px 8px; font-size: 12px; opacity: .38; }
  .meta kbd { font: inherit; padding: 0 4px; border-radius: 4px; background: rgba(255,255,255,.1); }
  #text {
    flex: 1; overflow-y: auto; padding: 6px 22px 24px; outline: none; white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: 15px; line-height: 1.75; caret-color: var(--accent);
  }
  :root { --note-fs: 15px; }
  #text { font-size: var(--note-fs); }
  .fmtbar { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; padding: 0 18px 6px; }
  .fmtbar button, .fmtbar select { height: 28px; min-width: 28px; padding: 0 7px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
  .fmtbar button:hover { background: rgba(255,255,255,.14); }
  .fmtbar > * { flex: none; }
  .fmtbar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.12); margin: 0 4px; }
  .fmtbar .fsz { min-width: 22px; text-align: center; font-size: 12px; opacity: .8; }
  .fmtbar .mkr { background: rgba(255,211,107,.4); border-radius: 3px; padding: 0 3px; }
  /* оформление разметки (как в Obsidian): значки приглушены, текст оформлен */
  #text .md-mk { opacity: .35; font-weight: 400; font-style: normal; }
  #text .md-b { font-weight: 700; }
  #text .md-i { font-style: italic; }
  #text .md-s { text-decoration: line-through; }
  #text .md-mark { background: rgba(255,211,107,.28); border-radius: 3px; }
  #text .md-code, #text .md-pre { font-family: Consolas, "Cascadia Mono", monospace; font-size: .9em; background: rgba(255,255,255,.07); border-radius: 5px; }
  #text .md-tag { color: #c6b8ff; background: rgba(169,155,255,.14); border-radius: 6px; }
  #text .md-hd { font-weight: 700; color: #e6e0ff; text-shadow: 0 0 18px rgba(169,155,255,.45); }
  #text .md-h0 { font-size: 1.75em; } #text .md-h1 { font-size: 1.45em; } #text .md-h2 { font-size: 1.25em; } #text .md-h3, #text .md-h4, #text .md-h5 { font-size: 1.1em; }
  #text .md-q { color: rgba(255,255,255,.75); font-style: italic; }
  #text .md-bul, #text .md-box { color: var(--accent); }
  #text .md-box { cursor: pointer; font-family: Consolas, monospace; }
  #text .md-task.done { text-decoration: line-through; opacity: .55; }
  #text .md-hr { color: rgba(255,255,255,.3); letter-spacing: 4px; }
  #text:empty::before { content: "Начни писать… Ссылка на другую заметку — [[Название]]"; color: rgba(255,255,255,.22); pointer-events: none; }
  /* картинки в тексте заметки */
  #text img.nimg {
    display: block; max-width: min(100%, 720px); max-height: 480px; margin: 8px 0; border-radius: 12px; cursor: zoom-in;
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: fade .35s var(--ease);
  }
  #text img.nimg:hover { border-color: rgba(124,200,255,.6); }
  .lightbox { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5,6,12,.82); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .25s; cursor: zoom-out; }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: scale(.94); transition: transform .35s var(--ease); }
  .lightbox.show img { transform: none; }
  /* разметка без обёрток в тексте — через CSS Highlight API */
  ::highlight(spell) { text-decoration: underline wavy #ff6b8a; text-decoration-thickness: 1.5px; text-underline-offset: 4px; background-color: rgba(255, 90, 120, .1); }
  ::highlight(wl) { color: #9fd6ff; background-color: rgba(124, 200, 255, .12); text-decoration: underline; text-decoration-color: rgba(124, 200, 255, .5); text-underline-offset: 4px; }
  ::highlight(wlnew) { color: #c6b8ff; background-color: rgba(169, 155, 255, .1); text-decoration: underline dashed; text-decoration-color: rgba(169, 155, 255, .55); text-underline-offset: 4px; }
  ::highlight(hd) { color: #d9cfff; text-shadow: 0 0 18px rgba(169, 155, 255, .55); }
  ::highlight(flash) { background-color: rgba(255, 211, 107, .35); }

  /* обратные ссылки */
  .links { flex: none; border-top: 1px solid rgba(255,255,255,.08); margin: 0 12px; }
  .links-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px; font-size: 12px; opacity: .6; cursor: pointer; user-select: none; }
  .links-head:hover { opacity: .9; }
  .links-head b { padding: 0 7px; border-radius: 8px; background: rgba(124,200,255,.2); color: var(--accent); font-weight: 600; }
  .links-head svg { width: 12px; height: 12px; margin-left: auto; transition: transform .3s var(--ease); }
  .links.shut .links-head svg { transform: rotate(-90deg); }
  .links-list { max-height: 170px; overflow-y: auto; padding: 0 4px 10px; display: flex; flex-direction: column; gap: 6px; transition: max-height .35s var(--ease); }
  .links.shut .links-list { max-height: 0; padding-bottom: 0; overflow: hidden; }
  .bl { padding: 8px 10px; border-radius: 10px; cursor: pointer; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); transition: background .15s; }
  .bl:hover { background: rgba(255,255,255,.09); }
  .bl b { display: block; font-size: 13px; }
  .bl span { display: block; font-size: 12px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bl mark { background: none; color: var(--accent); }
  .empty-links { font-size: 12px; opacity: .35; padding: 0 10px 10px; }

  /* ---------- Всплывашки: варианты исправления, превью ссылки, автодополнение, кнопка цитаты ---------- */
  .sugg, .peek, .ac {
    position: fixed; z-index: 10; border-radius: 15px;
    opacity: 0; transform: translateY(8px) scale(.94); pointer-events: none;
    transition: opacity .18s ease, transform .3s var(--ease);
  }
  .sugg.below, .peek.below, .ac { transform: translateY(-8px) scale(.96); }
  .sugg.show, .peek.show, .ac.show { opacity: 1; transform: none; pointer-events: auto; }
  .sugg { max-width: 380px; padding: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt {
    position: relative; padding: 5px 12px; border-radius: 10px; cursor: pointer; font-size: 14px;
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.2); transition: background .15s, transform .1s;
    opacity: 0; animation: pop .3s var(--ease) forwards;
  }
  .opt:nth-child(2) { animation-delay: .03s; } .opt:nth-child(3) { animation-delay: .06s; }
  .opt:nth-child(4) { animation-delay: .09s; } .opt:nth-child(5) { animation-delay: .12s; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .opt:first-child { background: rgba(255,255,255,.28); font-weight: 600; }
  .opt:hover { background: rgba(255,255,255,.36); }
  .opt:active { transform: scale(.95); }
  .opt i { position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: #ffd36b; }
  .none { padding: 3px 6px; font-size: 13px; opacity: .8; }
  .foot { display: flex; gap: 4px; margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.16); }

  /* посередине ветки: палитра цвета и ✕ — разорвать */

  .m-pop .pick div:hover { background: rgba(255,255,255,.16); }

  .m-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; opacity: .5; font-size: 14px; pointer-events: none; }
  /* телефон: в конце, чтобы перекрывать обычные правила */
  @media (max-width: 760px) {
    .bar { height: 50px; padding-left: 8px; }
    .bar .ttl, .wbtns { display: none; }
    .tabs { position: relative; left: auto; top: auto; transform: none; margin: 0; } /* relative — подсветка вкладки считается от самих вкладок */
    .tabs button { padding: 0 10px; }
    .sync { gap: 4px; padding-right: 6px; }
    .sbtn { padding: 0 8px; font-size: 0; gap: 4px; }
    .sbtn b { font-size: 12px; }
    .sstat { font-size: 11px; }
    .app { padding: 0 8px 8px; }
    aside { width: 100%; }
    .editor { display: none; }
    html.editing aside { display: none; }
    html.editing .editor { display: flex; }
    .back { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border: 0; border-radius: 11px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer; }
    .back svg { width: 18px; height: 18px; }
    .ehead { flex-wrap: wrap; gap: 8px; padding: 12px 12px 2px; }
    #title { flex-basis: calc(100% - 100px); font-size: 20px; }
    .meta { padding: 0 12px 6px; font-size: 0; }
    #meta { font-size: 12px; }
    :root { --note-fs: 16px; }
    #text { padding: 6px 12px 24px; }
    .fmtbar { flex-wrap: nowrap; overflow-x: auto; padding: 0 8px 6px; }
    .app { min-width: 0; } /* длинная панель листается сама, а не растягивает экран вбок */
    .links-list { max-height: 120px; }
    .item { padding: 11px 12px; }
    .m-tools { flex-wrap: nowrap; overflow-x: auto; }
    .m-tools .hint, .g-hint { display: none; }
    .seg button { padding: 0 9px; }
    .spop { left: 8px; right: 8px; width: auto; top: 54px; }
    .m-fmt { flex-wrap: wrap; max-width: calc(100% - 16px); }
    /* телефону тяжело: размытие под панелями и большие тени пересчитываются на каждом кадре движения */
    .m-act, .m-fmt { backdrop-filter: none; }
    .mn { box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .mn.sel { box-shadow: 0 0 0 3px rgba(124,200,255,.2); }
  }
</style>
</head>
<body>
<div class="bar">
  <div class="ttl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>Заметки</div>
  <div class="tabs" id="tabs">
    <i class="glider" id="glider"></i>
    <button data-view="notes" class="on">Заметки</button>
    <button data-view="graph">Граф</button>
    <button data-view="map">Карты</button>
  </div>
  <div class="sync" id="sync">
    <button class="sbtn" id="syncOut" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.5 1.5A3.75 3.75 0 0 1 17.5 18"/><path d="M12 20v-8M9 15l3-3 3 3"/></svg>Отправить <b></b></button>
    <button class="sbtn in" id="syncIn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.5 1.5A3.75 3.75 0 0 1 17.5 18"/><path d="M12 12v8M9 17l3 3 3-3"/></svg>Загрузить <b></b></button>
    <span class="sstat" id="syncStat"></span>
    <button class="scfg" id="syncCfg" title="Синхронизация с телефоном"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.5 1.5A3.75 3.75 0 0 1 17.5 18z"/></svg></button>
  </div>
  <div class="wbtns">
    <button id="wMin" title="Свернуть" aria-label="Свернуть"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
    <button id="wMax" title="Развернуть" aria-label="Развернуть"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
    <button id="wClose" class="wclose" title="Закрыть" aria-label="Закрыть"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="currentColor"/></svg></button>
  </div>
</div>

<div class="views">
  <div class="view on" id="v-notes">
    <div class="app">
      <aside class="glass-in">
        <div class="side-top">
          <button class="new" id="new" title="Ctrl+N"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Новая заметка</button>
          <button class="newg" id="newGroup" title="Новая группа" aria-label="Новая группа"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10.5v5M9.5 13h5"/></svg></button>
        </div>
        <input class="search" id="search" placeholder="Поиск (Ctrl+F)" aria-label="Поиск по заметкам">
        <div class="list" id="list"></div>
      </aside>
      <div class="editor glass-in">
        <div class="ehead">
          <button class="back" id="back" title="К списку" aria-label="К списку заметок"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <input id="title" placeholder="Название" aria-label="Название заметки" spellcheck="false">
          <button class="hchip" id="groupBtn" title="Группа заметки"></button>
          <button class="hchip" id="toMap" title="Положить заметку на карту"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>На карту</button>
          <button class="del" id="del" title="Удалить заметку"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Точно удалить?</span></button>
        </div>
        <div class="meta"><span id="meta"></span> · <kbd>[[</kbd> ссылка · <kbd>Ctrl</kbd>+клик — перейти</div>
        <div class="fmtbar" id="fmtbar" role="toolbar" aria-label="Оформление текста">
          <select id="fHead" title="Заголовок" aria-label="Заголовок"><option value="x" hidden>Заголовок</option><option value="0">Обычный текст</option><option value="1">Заголовок 1</option><option value="2">Заголовок 2</option><option value="3">Заголовок 3</option></select>
          <button data-md="b" title="Жирный (Ctrl+B)"><b>Ж</b></button><button data-md="i" title="Курсив (Ctrl+I)"><i>К</i></button><button data-md="s" title="Зачёркнутый"><s>З</s></button><button data-md="mark" title="Выделить маркером"><span class="mkr">М</span></button><button data-md="code" title="Код">&lt;/&gt;</button>
          <i class="sep"></i>
          <button data-md="ul" title="Список">•</button><button data-md="ol" title="Нумерованный список">1.</button><button data-md="task" title="Задача с галочкой">☑</button><button data-md="q" title="Цитата">❝</button><button data-md="hr" title="Черта">—</button><button data-md="link" title="Ссылка на заметку">[[ ]]</button>
          <i class="sep"></i>
          <button data-md="dec" title="Мельче">A−</button><span id="fSize" class="fsz">15</span><button data-md="inc" title="Крупнее">A+</button>
          <select id="fFont" title="Шрифт заметки" aria-label="Шрифт заметки"></select>
        </div>
        <div id="text" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Текст заметки"></div>
        <div class="links" id="links">
          <div class="links-head" id="linksHead">Ссылаются сюда <b id="blCount">0</b>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="links-list" id="blList"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="view" id="v-graph"></div>
  <div class="view" id="v-map"></div>
</div>

<div class="sugg glass-pop" id="sugg" role="dialog" aria-label="Варианты исправления"></div>
<div class="peek glass-pop" id="peek" role="tooltip"></div>
<div class="ac glass-pop" id="ac" role="listbox" aria-label="Заметки для ссылки"></div>
<button class="quote glass-pop" id="quoteBtn">🔗 Ссылка на цитату</button>
<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="gmenu glass-pop" id="gmenu" role="menu" aria-label="Выбрать группу"></div>
<div class="toast glass-pop" id="toast" role="status"></div>
<div class="spop glass-pop" id="syncPop" role="dialog" aria-label="Синхронизация с телефоном"></div>

<script src="synccore.js"></script>
<script src="mobile-api.js"></script>
<script src="spellcore.js"></script>
<script src="graph.js"></script>
<script src="map.js"></script>
<script>
const rawApi = window.win || { send() {}, on() {}, invoke: async () => null }; // в обычном браузере — заглушка
// любое сохранение (заметка, группа, карта, удаление) — сразу пересчитать кнопку «Отправить»
let changeT;
const api = { ...rawApi, send(ch, data) {
  rawApi.send(ch, data);
  if (/^(note-save|note-group|note-delete|groups-save|maps-save)$/.test(ch)) { clearTimeout(changeT); changeT = setTimeout(() => refreshSync(false), 900); }
} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const textEl = $('text'), titleEl = $('title');
const later = (fn, ms) => { let t; const run = () => { clearTimeout(t); t = null; fn(); }; const f = () => { clearTimeout(t); t = setTimeout(run, ms); }; f.flush = () => t && run(); return f; };

$('wMin').onclick = () => api.send('win-min');
$('wMax').onclick = () => api.send('win-max');
$('wClose').onclick = () => { save.flush(); api.send('win-close'); };

// ================= Вкладки: Заметки / Граф / Карты =================
let view = 'notes';
function showView(name) {
  view = name;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + name));
  const b = document.querySelector(`.tabs button[data-view="${name}"]`);
  Object.assign($('glider').style, { left: b.offsetLeft + 'px', width: b.offsetWidth + 'px' });
  hidePop(true); hidePeek(true); closeAc(); $('quoteBtn').classList.remove('show');
  name === 'graph' ? graph.show() : graph.hide();
  name === 'map' ? map.show() : map.hide();
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (b) { save.flush(); showView(b.dataset.view); } });

// ================= Заметки =================
let notes = [], cur = null;
const sorted = () => [...notes].sort((a, b) => b.updated - a.updated);
const fmtDate = ts => {
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return 'сегодня, ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('ru-RU', d.getFullYear() === now.getFullYear() ? { day: 'numeric', month: 'short' } : undefined);
};
const isEmpty = n => !n.title.trim() && !n.text.trim();
// картинка в тексте заметки хранится как ![](file:///…/media/xxx.png), а в редакторе показывается картинкой
const IMGTOK = /!\[[^\]\n]*\]\(([^)\s]+)\)/g;
const plain = t => t.replace(IMGTOK, '🖼'); // для списка, превью и обратных ссылок
// имя заметки для ссылок: название, а если его нет — первая строка
const nameOf = n => n.title.trim() || plain(n.text).split('\n').map(l => l.trim()).find(Boolean) || 'Без названия';
const byName = name => notes.find(n => nameOf(n).toLowerCase() === name.trim().toLowerCase());

// ================= Группы заметок =================
let groups = []; // [{ id, name, color, open }]
const GCOL = ['#7cc8ff', '#a99bff', '#5fe0b0', '#ffd36b', '#ff8a6b', '#ff6b9a', '#c6f06b', '#e6e8f0'];
const saveGroups = () => api.send('groups-save', groups);
const groupOf = n => n && groups.find(g => g.id === n.group) || null;
const CHEV = '<svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function itemHTML(n) {
  const lines = plain(n.text).split('\n').map(l => l.trim()).filter(Boolean);
  const title = n.title.trim() || lines.shift() || 'Без названия';
  return `<div class="item ${cur && n.id === cur.id ? 'sel' : ''}" data-id="${esc(n.id)}" draggable="true" title="Перетащи в группу">
    <b>${esc(title)}</b><div class="pv">${esc(lines[0] || ' ')}</div><div class="dt">${fmtDate(n.updated)}</div></div>`;
}
function drawList() {
  const q = $('search').value.trim().toLowerCase();
  const match = n => !q || (n.title + '\n' + n.text).toLowerCase().includes(q);
  const all = sorted().filter(match);
  if (!groups.length) {
    $('list').innerHTML = all.map(itemHTML).join('') || `<div class="nothing">${q ? 'Ничего не найдено' : 'Заметок пока нет'}</div>`;
    return;
  }
  let html = '';
  for (const g of groups) {
    const items = all.filter(n => n.group === g.id);
    if (q && !items.length) continue;
    const open = g.open || !!q; // при поиске группы с находками раскрыты
    html += `<div class="ghead ${open ? '' : 'shut'}" data-g="${esc(g.id)}" style="--gc:${esc(g.color)}">${CHEV}
      <i class="dot" data-gact="color" title="Сменить цвет"></i><span class="gname">${esc(g.name)}</span><span class="cnt">${items.length}</span>
      <span class="ga"><button data-gact="add" title="Новая заметка в этой группе">＋</button><button data-gact="map" title="Все заметки группы — на карту">🗺</button>
      <button data-gact="rename" title="Переименовать">✎</button><button data-gact="del" title="Удалить группу (заметки останутся)">🗑</button></span></div>`;
    if (open) html += `<div class="gitems" data-g="${esc(g.id)}" style="--gc:${esc(g.color)}">${items.map(itemHTML).join('') || '<div class="nothing">Перетащи сюда заметки</div>'}</div>`;
  }
  const loose = all.filter(n => !groupOf(n));
  if (loose.length || !q) html += `<div class="ghead loose" data-g=""><span style="width:10px"></span><i class="dot"></i><span class="gname">Без группы</span><span class="cnt">${loose.length}</span></div>
    <div class="gitems" data-g="" style="--gc:rgba(255,255,255,.3)">${loose.map(itemHTML).join('')}</div>`;
  $('list').innerHTML = html || '<div class="nothing">Ничего не найдено</div>';
}
function setGroup(id, gid) {
  const n = notes.find(x => x.id === id);
  if (!n || (n.group || '') === (gid || '')) return;
  n.group = gid || null;
  api.send('note-group', { id, group: n.group });
  drawList(); drawGroupChip();
}
function newGroup(thenAssign) {
  const g = { id: crypto.randomUUID(), name: 'Новая группа', color: GCOL[groups.length % GCOL.length], open: true };
  groups.push(g); saveGroups();
  if (thenAssign && cur) setGroup(cur.id, g.id);
  drawList();
  renameGroup(g);
}
function renameGroup(g) {
  const name = $('list').querySelector(`.ghead[data-g="${CSS.escape(g.id)}"] .gname`);
  if (!name) return;
  name.contentEditable = 'plaintext-only';
  name.focus();
  getSelection().selectAllChildren(name);
  name.onkeydown = e => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); name.blur(); } };
  name.onblur = () => { g.name = name.textContent.trim().slice(0, 80) || g.name; saveGroups(); drawList(); drawGroupChip(); };
}
let armedGroup = null, armedT;
$('list').addEventListener('click', e => {
  const head = e.target.closest('.ghead'), act = e.target.closest('[data-gact]')?.dataset.gact;
  if (head && !head.classList.contains('loose')) {
    const g = groups.find(x => x.id === head.dataset.g);
    if (!g || e.target.closest('.gname[contenteditable]')) return;
    if (act === 'color') { g.color = GCOL[(GCOL.indexOf(g.color) + 1) % GCOL.length]; saveGroups(); drawList(); drawGroupChip(); return; }
    if (act === 'add') { g.open = true; saveGroups(); const n = createNote('', g.id); select(n.id); document.documentElement.classList.add('editing'); titleEl.focus(); return; }
    if (act === 'map') return sendToMap(notes.filter(n => n.group === g.id && !isEmpty(n)).map(n => n.id));
    if (act === 'rename') return renameGroup(g);
    if (act === 'del') { // удаление в два нажатия; заметки не удаляются — переходят в «Без группы»
      if (armedGroup !== g.id) { armedGroup = g.id; e.target.closest('button').classList.add('armed'); e.target.closest('button').title = 'Нажми ещё раз — удалить группу'; clearTimeout(armedT); armedT = setTimeout(() => { armedGroup = null; drawList(); }, 3000); return; }
      armedGroup = null;
      groups = groups.filter(x => x !== g);
      notes.filter(n => n.group === g.id).forEach(n => { n.group = null; api.send('note-group', { id: n.id, group: null }); });
      saveGroups(); drawList(); drawGroupChip();
      return;
    }
    g.open = !g.open; saveGroups(); drawList(); // клик по заголовку — свернуть/развернуть
    return;
  }
  const it = e.target.closest('.item[data-id]');
  if (it) { select(it.dataset.id); document.documentElement.classList.add('editing'); } // на телефоне — открыть заметку на весь экран
});
// перетаскивание заметки в группу (или в «Без группы»)
$('list').addEventListener('dragstart', e => {
  const it = e.target.closest('.item[data-id]');
  if (!it) return;
  e.dataTransfer.setData('application/x-note', it.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  it.classList.add('dragging');
});
$('list').addEventListener('dragend', () => $('list').querySelectorAll('.dragging, .drop').forEach(x => x.classList.remove('dragging', 'drop')));
const dropZone = e => e.dataTransfer.types.includes('application/x-note') && e.target.closest('.ghead, .gitems');
$('list').addEventListener('dragover', e => {
  const z = dropZone(e);
  $('list').querySelectorAll('.drop').forEach(x => x !== z && x.classList.remove('drop'));
  if (!z) return;
  e.preventDefault();
  z.classList.add('drop');
});
$('list').addEventListener('drop', e => {
  const z = dropZone(e);
  if (!z) return;
  e.preventDefault();
  setGroup(e.dataTransfer.getData('application/x-note'), z.dataset.g);
});
$('newGroup').onclick = () => newGroup(false);

// группа текущей заметки — кнопка в шапке и меню выбора
function drawGroupChip() {
  const g = groupOf(cur);
  $('groupBtn').style.setProperty('--gc', g ? g.color : 'rgba(255,255,255,.3)');
  $('groupBtn').innerHTML = `<i></i>${g ? esc(g.name) : 'Без группы'} ▾`;
}
$('groupBtn').onclick = () => {
  const menu = $('gmenu'), r = $('groupBtn').getBoundingClientRect(), g = groupOf(cur);
  menu.innerHTML = groups.map(x => `<div data-pick="${esc(x.id)}" class="${g === x ? 'on' : ''}" style="--gc:${esc(x.color)}"><i></i>${esc(x.name)}</div>`).join('')
    + `<div data-pick="" class="${g ? '' : 'on'}" style="--gc:rgba(255,255,255,.3)"><i></i>Без группы</div><div data-pick="+">＋ Новая группа</div>`;
  menu.style.left = Math.min(r.left, innerWidth - 230) + 'px';
  menu.style.top = r.bottom + 6 + 'px';
  menu.classList.add('show');
};
$('gmenu').addEventListener('click', e => {
  const d = e.target.closest('[data-pick]');
  if (!d || !cur) return;
  $('gmenu').classList.remove('show');
  d.dataset.pick === '+' ? newGroup(true) : setGroup(cur.id, d.dataset.pick);
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('#gmenu, #groupBtn')) $('gmenu').classList.remove('show'); });

// заметки — на карту (кнопка в шапке и 🗺 у группы)
async function sendToMap(ids) {
  if (!ids.length) return;
  save.flush();
  showView('map');
  await map.show();
  map.addNotes(ids);
}
$('toMap').onclick = () => { if (cur && !isEmpty(cur)) sendToMap([cur.id]); };

function select(id) {
  save.flush();
  commitRename();
  // пустую заметку, с которой ушли, не храним
  if (cur && cur.id !== id && isEmpty(cur)) { notes = notes.filter(n => n !== cur); api.send('note-delete', cur.id); }
  cur = notes.find(n => n.id === id) || null;
  disarm();

  if (st.expired) { stat.textContent = '⚠ Войти в Google'; stat.title = 'Google попросил войти заново'; stat.classList.add('warn'); out.hidden = true; }
  else if (st.failed) { stat.textContent = '⚠ ошибка облака'; stat.title = driveError(st.failed); stat.classList.add('warn'); out.disabled = true; }
  else if (st.password) { stat.textContent = '🔒 нужен пароль'; stat.title = 'Заметки в облаке зашифрованы — введи пароль'; stat.classList.add('warn'); out.hidden = true; }
  else if (!st.connected) { stat.textContent = ''; stat.title = ''; }
  else if (st.offline) { stat.textContent = '☁ нет сети'; stat.title = 'Облако недоступно: ' + (st.error || ''); }
  else if (!st.out && !st.inc) { stat.textContent = '☁ ✓'; stat.title = 'Всё синхронизировано'; }
  else stat.textContent = '';
}
let lastStatus = {};
const driveError = e => e === 'drive-api-off'
  ? 'В твоём проекте Google Cloud не включён Google Drive API. Включи его (APIs & Services → Library → Google Drive API → Enable), подожди пару минут и нажми ☁ снова.'
  : e === 'drive-no-permission'
    ? 'Google не дал доступ к папке приложения. Отключи и подключи Google Диск снова — при входе оставь галочку доступа к данным приложения.'
    : 'Google Диск ответил ошибкой: ' + e;

// --- настройки: подключение Google Диска и шифрование ---
const spop = $('syncPop');
async function drawSyncPop(msg = '') {
  const info = await api.invoke('sync-info') || {}, st = lastStatus;
  const pass = st.password ? 'need' : info.encrypted ? 'on' : 'off';
  spop.innerHTML = `<h4>Синхронизация с телефоном</h4>
    ${info.connected
      ? `<div class="ok">✓ ${info.test ? 'Тестовое облако' : 'Google Диск подключён'}</div>
         <p class="hint">Приложение видит только свою скрытую папку на Диске — остальные файлы ему недоступны.</p>
         <div class="btns"><button data-a="disc">Отключить</button></div>`
      : `<p>Заметки, группы и карты будут ходить между ПК и телефоном через твой Google Диск.
           Приложение видит только свою скрытую папку — остальной Диск ему недоступен.</p>
         <div class="btns"><button class="primary" data-a="conn">${st.expired ? 'Войти в Google снова' : 'Подключить Google Диск'}</button></div>`}
    <hr><h5>Шифрование паролем ${pass === 'on' ? '— включено 🔒' : pass === 'need' ? '— нужен пароль' : '— выключено'}</h5>
    ${pass === 'need'
      ? `<p class="hint">Заметки в облаке зашифрованы. Введи тот же пароль, что на другом устройстве.</p>
         <input type="password" id="spP1" placeholder="Пароль" autocomplete="off"><div class="btns"><button class="primary" data-a="enter">Ввести</button></div>`
      : pass === 'on'
        ? `<p class="hint">Файлы в облаке нельзя прочитать без пароля — даже если кто-то войдёт в твой Google.</p>
           <input type="password" id="spP1" placeholder="Новый пароль (от 8 символов)" autocomplete="off">
           <input type="password" id="spP2" placeholder="Повтори новый пароль" autocomplete="off">
           <div class="btns"><button data-a="set">Сменить пароль</button><button data-a="off">Выключить</button></div>`
        : `<p class="hint">Файлы в облаке нельзя будет прочитать без пароля — даже если кто-то войдёт в твой Google.
             Пароль вводится один раз на каждом устройстве. Забудешь — копию в облаке не открыть (заметки на устройствах останутся).</p>
           <input type="password" id="spP1" placeholder="Придумай пароль (от 8 символов)" autocomplete="off">
           <input type="password" id="spP2" placeholder="Повтори пароль" autocomplete="off">
           <div class="btns"><button class="primary" data-a="set">Включить шифрование</button></div>`}
    <div class="msg">${esc(msg || (st.failed ? driveError(st.failed) : ''))}</div>`;
}
const openPop = () => { spop.classList.add('show'); drawSyncPop(); };
$('syncCfg').onclick = () => spop.classList.contains('show') ? spop.classList.remove('show') : openPop();
$('syncStat').onclick = () => lastStatus.expired ? connectGoogle() : openPop();
document.addEventListener('pointerdown', e => { if (!e.target.closest('#syncPop, #syncCfg, #syncStat')) spop.classList.remove('show'); });
async function connectGoogle() {
  openPop();
  drawSyncPop('Открылся браузер — войди в Google и нажми «Разрешить». Окно браузера потом можно закрыть.');
  const r = await api.invoke('sync-connect') || {};
  await refreshSync(true);
  drawSyncPop(r.error ? (r.error === 'timeout' ? 'Не дождался входа — попробуй ещё раз.' : 'Не получилось войти: ' + r.error) : 'Готово! Google Диск подключён.');
}
let discArmed = false;
spop.addEventListener('click', async e => {
  const a = e.target.closest('[data-a]')?.dataset.a;
  if (!a) return;
  const p1 = $('spP1')?.value || '', p2 = $('spP2')?.value || '';
  if (a === 'conn') return connectGoogle();
  if (a === 'disc') {
    if (!discArmed) { discArmed = true; e.target.classList.add('armed'); e.target.textContent = 'Точно отключить?'; setTimeout(() => { discArmed = false; drawSyncPop(); }, 3000); return; }
    discArmed = false;
    await api.invoke('sync-disconnect');
    await refreshSync(true);
    return drawSyncPop('Отключено. Заметки на этом ПК остались на месте.');
  }
  if (a === 'set') {
    if (p1.length < 8) return drawSyncPop('Пароль — минимум 8 символов.');
    if (p1 !== p2) return drawSyncPop('Пароли не совпадают.');
    const r = await api.invoke('sync-password', { password: p1, rewrite: true });
    await refreshSync(true);
    return drawSyncPop(r.warn ? 'Пароль сохранён.' : 'Шифрование включено. На телефоне нужно будет ввести этот же пароль.');
  }
  if (a === 'off') {
    const r = await api.invoke('sync-password', { password: '', rewrite: true });
    await refreshSync(true);
    return drawSyncPop(r.warn ? 'Не получилось расшифровать облако: ' + r.warn : 'Шифрование выключено.');
  }
  if (a === 'enter') {
    await api.invoke('sync-password', { password: p1, rewrite: false });
    await refreshSync(true);
    return drawSyncPop(lastStatus.password ? 'Неверный пароль.' : 'Пароль подошёл.');
  }
});
$('syncOut').onclick = async () => {
  save.flush();
  syncing = true; $('syncOut').disabled = true;
  const r = await api.invoke('sync-send') || {};
  syncing = false;
  if (r.error) toast(r.error === 'busy' ? 'Синхронизация уже идёт…' : 'Не получилось отправить: ' + r.error);
  else toast(`Отправлено: ${r.sent}` + (r.blocked ? ` · ${r.blocked} изменено и на другом устройстве — нажми «Загрузить», потом снова «Отправить»` : ''));
  refreshSync(true);
};
$('syncIn').onclick = async () => {
  save.flush();
  syncing = true; $('syncIn').disabled = true;
  const r = await api.invoke('sync-load') || {};
  syncing = false; $('syncIn').disabled = false;
  if (r.error) { toast('Не получилось загрузить: ' + r.error); return refreshSync(true); }
  const msg = `Загружено: ${r.loaded}` + (r.conflicts ? ` · ${r.conflicts} конфликт(а): вторая версия сохранена копией с пометкой «с другого устройства»` : '');
  // заметки и карты в окне устарели — перезагружаем окно и возвращаемся туда же
  try { sessionStorage.setItem('afterSync', JSON.stringify({ msg, view, cur: cur && cur.id })); } catch {}
  location.reload();
};
addEventListener('focus', () => refreshSync(true)); // вернулся к окну — проверить облако
setInterval(() => refreshSync(true), 60000);

// ================= Запуск =================
(async () => {
  [notes, groups] = await Promise.all([api.invoke('notes-list'), api.invoke('groups-list'), sp.loadWords()]);
  notes = Array.isArray(notes) ? notes : [];
  groups = Array.isArray(groups) ? groups : [];
  let after = null;
  try { after = JSON.parse(sessionStorage.getItem('afterSync')); sessionStorage.removeItem('afterSync'); } catch {}
  const back = after && notes.find(n => n.id === after.cur);
  back ? select(back.id) : notes.length ? select(sorted()[0].id) : newNote();
  showView(after && after.view || 'notes');
  if (after) toast(after.msg);
  refreshSync(true);
})();
</script>
